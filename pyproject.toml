[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tree-detection"
version = "0.1.0"
description = "Tree detection utilities for geospatial imagery"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Acorn" }]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
geo = [
    "folium>=0.14",
    "geopandas>=0.12",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=9.0",
    "pyproj>=3.5",
    "rasterio>=1.3",
    "shapely>=2.0",
]
ml = [
    "rfdetr>=1.11",
    "supervision>=0.20",
    "torch>=2.0",
    "torchvision>=0.15",
    "ultralytics>=8.0",
]

[project.scripts]
tree-detection-convert-yolo = "tree_detection.converter_yolo:main"
tree-detection-train = "tree_detection.training:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]
deploy = [
    "modal>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tree_detection"]

[tool.pytest.ini_options]
addopts = "--cov=tree_detection --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
